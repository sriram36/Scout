<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>iCIMS login</title></head>
<body>
  <h2>Returning candidates</h2>
  <div><label for="loginemail">Email Address</label><input id="loginemail" name="loginEmailAddress" type="text"></div>
  <div><label for="loginpw">Password</label><input id="loginpw" name="loginPassword" type="password"></div>
  <button type="button" id="login">Log in</button>
  <script>window.__loginClicks = 0; document.getElementById('login').addEventListener('click', function () { window.__loginClicks++; });</script>
</body>
</html>
