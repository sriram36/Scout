<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme — Lever</title></head>
<body>
  <div class="lever-apply">
    <h1>Platform Engineer</h1>
    <form method="POST" id="lever-form" action="/apply">
      <input type="hidden" name="origin" value="https://jobs.lever.co/acme">
      <div>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="text">
      </div>
      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text">
      </div>
      <div>
        <label for="org">Current company</label>
        <input id="org" name="org" type="text">
      </div>
      <div>
        <label for="resume-upload-input">Resume/CV</label>
        <input id="resume-upload-input" name="resume" type="file">
      </div>
      <div>
        <label for="li">LinkedIn URL</label>
        <input id="li" name="urls[LinkedIn]" type="text">
      </div>
      <div>
        <label for="gh">GitHub URL</label>
        <input id="gh" name="urls[GitHub]" type="text">
      </div>
      <div>
        <label for="pf">Portfolio URL</label>
        <input id="pf" name="urls[Portfolio]" type="text">
      </div>
      <div>
        <label for="comments">Additional information</label>
        <textarea id="comments" name="comments"></textarea>
      </div>
      <div>
        <label for="eeo-gender">Gender</label>
        <select id="eeo-gender" name="eeo[gender]">
          <option value="">Select…</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <button type="submit" id="btn-submit">Submit application</button>
    </form>
  </div>
  <script>
    window.__submitted = false;
    document.getElementById('lever-form').addEventListener('submit', function (e) { e.preventDefault(); window.__submitted = true; });
  </script>
</body>
</html>
