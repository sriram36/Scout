<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job board — Apply is a script button</title></head>
<body>
  <header>
    <input type="search" placeholder="Search jobs" id="q">
    <input type="text" placeholder="Location" id="loc">
  </header>
  <aside>
    <label>Get job alerts <input type="email" id="alert" placeholder="Enter your email"></label>
    <button type="button" id="subscribe">Subscribe</button>
  </aside>
  <main><h1>Software Engineer</h1><button type="button" id="apply" onclick="location.href='/ashby.html'">Apply</button></main>
</body>
</html>
