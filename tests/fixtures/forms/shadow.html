<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — web component form</title></head>
<body>
  <h1>Product Engineer</h1>
  <form id="f">
    <div id="host-contact"></div>
    <div id="host-links"></div>
    <button type="submit" id="go">Submit application</button>
  </form>
  <script>
    function mount(hostId, html) {
      const host = document.getElementById(hostId);
      const root = host.attachShadow({ mode: 'open' });
      root.innerHTML = html;
    }
    // Labels, inputs and the label/for pairing all live inside open shadow roots.
    mount('host-contact', `
      <div><label for="sr-first">First name</label><input id="sr-first" name="firstName" type="text"></div>
      <div><label for="sr-last">Last name</label><input id="sr-last" name="lastName" type="text"></div>
      <div><label for="sr-email">Email</label><input id="sr-email" name="email" type="email"></div>
    `);
    // An input with neither id nor name, inside a shadow root.
    mount('host-links', `
      <div><span>LinkedIn Profile URL</span><input type="url"></div>
    `);
    window.__submitted = false;
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); window.__submitted = true; });
  </script>
</body>
</html>
