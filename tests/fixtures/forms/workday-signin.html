<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Workday — Sign In</title></head>
<body>
  <div data-automation-id="signInContent">
    <h2>Sign In</h2>
    <label for="user">Email Address</label>
    <input id="user" name="email" type="email">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password">
    <button data-automation-id="signInSubmitButton" id="signin" type="button">Sign In</button>
    <a data-automation-id="createAccountLink" href="#create">Create Account</a>
  </div>
  <script>window.__signInClicks = 0; document.getElementById('signin').addEventListener('click', function () { window.__signInClicks++; });</script>
</body>
</html>
