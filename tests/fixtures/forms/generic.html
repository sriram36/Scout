<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Acme Corp</title></head>
<body>
  <h1>Software Engineer, Platform</h1>
  <form id="app" action="/submit" method="post">
    <input type="hidden" name="csrf_token" value="tok-123">

    <h2>Contact</h2>
    <div>
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" type="text" required>
    </div>
    <div>
      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" type="text" required>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div>
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel">
    </div>
    <div>
      <label for="linkedin">LinkedIn Profile URL</label>
      <input id="linkedin" name="linkedin" type="url">
    </div>
    <div>
      <label for="github">GitHub</label>
      <input id="github" name="github" type="url">
    </div>

    <h2>Education</h2>
    <div>
      <label for="school">University</label>
      <input id="school" name="school" type="text">
    </div>
    <div>
      <label for="degree">Degree</label>
      <select id="degree" name="degree">
        <option value="">Select…</option>
        <option value="bachelors">Bachelor's Degree</option>
        <option value="masters">Master's Degree</option>
        <option value="phd">PhD</option>
      </select>
    </div>

    <h2>Documents</h2>
    <div>
      <label for="resume">Resume/CV</label>
      <input id="resume" name="resume" type="file">
    </div>

    <h2>Questions</h2>
    <div>
      <label for="why">Why do you want to work here?</label>
      <textarea id="why" name="why"></textarea>
    </div>
    <div>
      <label for="work_auth">Are you legally authorized to work in the United States?</label>
      <select id="work_auth" name="work_auth">
        <option value="">Select…</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <h2>Voluntary self-identification</h2>
    <div>
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select…</option>
        <option value="f">Female</option>
        <option value="m">Male</option>
        <option value="x">Decline to self-identify</option>
      </select>
    </div>
    <div>
      <label for="veteran">Veteran Status</label>
      <select id="veteran" name="veteran">
        <option value="">Select…</option>
        <option value="yes">I am a veteran</option>
        <option value="no">I am not a veteran</option>
      </select>
    </div>

    <button id="submit" type="submit">Submit application</button>
  </form>
  <script>
    window.__submitted = false;
    document.getElementById('app').addEventListener('submit', function (e) {
      e.preventDefault();
      window.__submitted = true;
    });
  </script>
</body>
</html>
